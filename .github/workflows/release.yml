name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Build Release
      run: dotnet publish PoeRedux/PoeRedux.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish
      
    - name: Rename executable
      run: |
        Move-Item -Path ./publish/PoeRedux.exe -Destination ./PoeRedux-${{ github.ref_name }}-win-x64.exe
      shell: pwsh
      
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          PoeRedux-${{ github.ref_name }}-win-x64.exe
        body: |
          ## PoE Redux ${{ github.ref_name }}

          ### Changelog
          - Apply Patches now warns when a selected patch finds nothing to patch, for example when the other game is selected or a game update moved the files.
          - Restore Original takes about 3 seconds less on PoE 2 and 2 seconds less on PoE 1.
          - After Apply Patches and Restore Original, PoE Redux gives the memory it used back to Windows instead of keeping several gigabytes.
          
          ### Installation
          1. Download `PoeRedux-${{ github.ref_name }}-win-x64.exe`
          2. Run the executable
          
          ### System Requirements
          - Windows 10 version 2004 or later
          - .NET 10.0 Runtime (included in self-contained build)
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
