name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Build Release
      run: dotnet publish PoeRedux/PoeRedux.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish
      
    - name: Rename executable
      run: |
        Move-Item -Path ./publish/PoeRedux.exe -Destination ./PoeRedux-${{ github.ref_name }}-win-x64.exe
      shell: pwsh
      
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          PoeRedux-${{ github.ref_name }}-win-x64.exe
        body: |
          ## PoE Redux ${{ github.ref_name }}

          ### Changelog
          - Applying patches is faster and uses less memory. Only files that patches change are written and backed up.
          - Fixed the "being used by another process" error and growing memory use when patches are applied again without restarting the app.
          - If a patch fails, game files are left unchanged.
          - While patches are applied, the window shows how many files are done out of the total.
          - Delete Backup and the Game selector are disabled while Apply Patches or Restore Original is running.
          - Backups made by older versions can still be restored with Restore Original.
          
          ### Installation
          1. Download `PoeRedux-${{ github.ref_name }}-win-x64.exe`
          2. Run the executable
          
          ### System Requirements
          - Windows 10 version 2004 or later
          - .NET 10.0 Runtime (included in self-contained build)
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
